<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eschool — Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3a0ca3;
            --accent-color: #4cc9f0;
            --success-color: #4ade80;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --dark-color: #1e293b;
            --gray-color: #64748b;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            line-height: 1.6;
            color: var(--dark-color);
            background-color: #f1f5f9;
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            line-height: 1.3;
        }

        /* ===== HEADER ===== */
        .dashboard-header {
            background-color: white;
            box-shadow: var(--card-shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            font-size: 2rem;
            color: var(--primary-color);
        }

        .logo-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--primary-color);
        }

        .logo-text span {
            color: var(--accent-color);
        }

        .admin-badge {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 12px;
            margin-left: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            flex-shrink: 0;
            overflow: hidden;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .user-meta .user-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .user-meta .user-role {
            font-size: 0.75rem;
            color: var(--gray-color);
        }

        .logout-link {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--danger-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 8px;
            transition: var(--transition);
        }

        .logout-link:hover {
            background-color: #fee;
        }

        /* ===== LAYOUT ===== */
        .admin-layout {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            display: grid;
            grid-template-columns: 230px 1fr;
            gap: 30px;
            align-items: start;
        }

        .admin-sidebar {
            background-color: white;
            border-radius: 12px;
            padding: 15px 0;
            box-shadow: var(--card-shadow);
            height: fit-content;
            position: sticky;
            top: 90px;
        }

        .admin-sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            text-decoration: none;
            color: var(--dark-color);
            border-left: 3px solid transparent;
            transition: var(--transition);
            font-size: 0.9rem;
            border-bottom: none;
        }

        .admin-sidebar .nav-item:hover {
            background-color: #f8fafc;
            color: var(--primary-color);
        }

        .admin-sidebar .nav-item.active {
            background-color: #e0e7ff;
            color: var(--primary-color);
            border-left-color: var(--primary-color);
            font-weight: 500;
        }

        .admin-sidebar .nav-item i {
            width: 18px;
            text-align: center;
        }

        .admin-content {
            min-width: 0;
        }

        /* ===== WELCOME BANNER ===== */
        .welcome-banner {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 12px;
            padding: 25px 30px;
            margin-bottom: 25px;
        }

        .welcome-banner h2 {
            font-size: 1.4rem;
            margin-bottom: 6px;
        }

        .welcome-banner p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        /* ===== STAT CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .stat-icon.users { background: #e0e7ff; color: var(--primary-color); }
        .stat-icon.admins { background: #fef3c7; color: var(--warning-color); }
        .stat-icon.resources { background: #dcfce7; color: var(--success-color); }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--gray-color);
        }

        /* ===== PANEL / TABLE ===== */
        .panel {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: var(--card-shadow);
            overflow-x: auto;
        }

        .panel h3 {
            margin-bottom: 18px;
            font-size: 1.1rem;
        }

        table.users-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 480px;
        }

        .users-table th,
        .users-table td {
            text-align: left;
            padding: 12px 10px;
            font-size: 0.9rem;
            border-bottom: 1px solid #f1f5f9;
            white-space: nowrap;
        }

        .users-table th {
            color: var(--gray-color);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .role-pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .role-pill.admin {
            background: #fef3c7;
            color: var(--warning-color);
        }

        .role-pill.student {
            background: #e0e7ff;
            color: var(--primary-color);
        }

        /* ===== DARK MODE ===== */
        body.dark-mode {
            background-color: #0f172a;
            color: #f1f5f9;
        }

        body.dark-mode .dashboard-header,
        body.dark-mode .admin-sidebar,
        body.dark-mode .panel,
        body.dark-mode .stat-card {
            background-color: #1e293b;
        }

        body.dark-mode .admin-sidebar .nav-item {
            color: #e2e8f0;
        }

        body.dark-mode .admin-sidebar .nav-item:hover {
            background-color: #263449;
            color: #90caf9;
        }

        body.dark-mode .admin-sidebar .nav-item.active {
            background-color: #1c2b47;
            color: #90caf9;
        }

        body.dark-mode .stat-icon.users { background: #1c2b47; color: #90caf9; }
        body.dark-mode .stat-icon.admins { background: #2d2a1a; color: #f59e0b; }
        body.dark-mode .stat-icon.resources { background: #1a2a2a; color: #4ade80; }

        body.dark-mode .users-table td {
            border-bottom-color: #334155;
        }

        body.dark-mode .users-table th {
            color: #94a3b8;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .admin-layout {
                grid-template-columns: 1fr;
                padding: 16px;
                gap: 16px;
            }

            .admin-sidebar {
                position: static;
                display: flex;
                flex-wrap: nowrap;
                overflow-x: auto;
                padding: 10px 15px;
                gap: 4px;
                border-radius: 12px;
                scrollbar-width: none;
                -ms-overflow-style: none;
            }

            .admin-sidebar::-webkit-scrollbar {
                display: none;
            }

            .admin-sidebar .nav-item {
                flex-shrink: 0;
                border-left: none;
                border-bottom: 3px solid transparent;
                padding: 10px 16px;
                border-radius: 8px 8px 0 0;
                font-size: 0.85rem;
            }

            .admin-sidebar .nav-item i {
                font-size: 1rem;
            }

            .admin-sidebar .nav-item.active {
                border-left-color: transparent;
                border-bottom-color: var(--primary-color);
                background-color: #e0e7ff;
                border-radius: 8px 8px 0 0;
            }

            body.dark-mode .admin-sidebar .nav-item.active {
                background-color: #1c2b47;
                border-bottom-color: #90caf9;
            }

            .admin-sidebar .nav-item span {
                display: inline;
            }
        }

        @media (max-width: 600px) {
            .header-container {
                flex-wrap: wrap;
                gap: 10px;
                padding: 12px 16px;
            }

            .user-meta {
                display: none;
            }

            .admin-layout {
                padding: 12px;
            }

            .welcome-banner {
                padding: 16px 20px;
            }

            .welcome-banner h2 {
                font-size: 1.2rem;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .stat-card {
                padding: 16px;
                gap: 12px;
            }

            .stat-icon {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .stat-value {
                font-size: 1.3rem;
            }

            .panel {
                padding: 16px;
            }

            .users-table {
                font-size: 0.75rem;
                min-width: 360px;
            }

            .users-table th,
            .users-table td {
                padding: 8px 8px;
            }

            .admin-sidebar {
                padding: 8px 12px;
                gap: 2px;
            }

            .admin-sidebar .nav-item {
                padding: 8px 12px;
                font-size: 0.75rem;
            }

            .admin-sidebar .nav-item i {
                font-size: 0.85rem;
            }
        }

        @media (max-width: 400px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .admin-sidebar .nav-item span {
                font-size: 0.7rem;
            }

            .admin-sidebar .nav-item i {
                font-size: 0.8rem;
            }

            .admin-sidebar .nav-item {
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="dashboard-header">
        <div class="header-container">
            <a href="/admin-dashboard" class="logo">
                <i class="fas fa-graduation-cap logo-icon"></i>
                <div class="logo-text">E<span>school</span></div>
                <span class="admin-badge">Admin</span>
            </a>

            <div class="header-actions">
                <div class="user-chip">
                    <div class="user-avatar" data-profile-avatar>
                        {% if avatar_url %}
                            <img src="{{ avatar_url }}" alt="Profile photo">
                        {% else %}
                            {{ firstname[0] }}{{ lastname[0] }}
                        {% endif %}
                    </div>
                    <div class="user-meta">
                        <div class="user-name">{{ firstname }} {{ lastname }}</div>
                        <div class="user-role">Administrator</div>
                    </div>
                </div>

                <a href="/logout" class="logout-link">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Log Out</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Layout -->
    <div class="admin-layout">
        <nav class="admin-sidebar" id="adminSidebar">
            <a href="/admin-dashboard" class="nav-item {% if request.endpoint == 'admin_dashboard' %}active{% endif %}">
                <i class="fas fa-gauge"></i>
                <span>Overview</span>
            </a>
            <a href="/admin_resources" class="nav-item {% if request.endpoint == 'admin_resources' %}active{% endif %}">
                <i class="fas fa-file-alt"></i>
                <span>Resources</span>
            </a>
            <a href="/admin_messages" class="nav-item {% if request.endpoint == 'admin_messages' %}active{% endif %}">
                <i class="fas fa-envelope"></i>
                <span>Messages</span>
            </a>
            <a href="/admin_support" class="nav-item {% if request.endpoint == 'admin_support' %}active{% endif %}">
                <i class="fas fa-headset"></i>
                <span>Support</span>
            </a>
            <a href="/dashboard?admin_preview=1" class="nav-item">
                <i class="fas fa-user"></i>
                <span>Student View</span>
            </a>
        </nav>

        <div class="admin-content">
            {% block allcontent %}{% endblock %}
        </div>
    </div>

    <script>
        // ===== SIDEBAR ACTIVE STATE =====
        document.addEventListener('DOMContentLoaded', function() {
            // Get all nav items
            const navItems = document.querySelectorAll('.admin-sidebar .nav-item');
            
            // Remove active class from all
            navItems.forEach(item => {
                item.classList.remove('active');
            });

            // Find the current page and add active class
            const currentPath = window.location.pathname;
            
            navItems.forEach(item => {
                const href = item.getAttribute('href');
                if (href && currentPath.includes(href.split('?')[0])) {
                    item.classList.add('active');
                }
            });

            // If no match found (e.g., root path), default to overview
            const hasActive = document.querySelector('.admin-sidebar .nav-item.active');
            if (!hasActive) {
                const overviewLink = document.querySelector('.admin-sidebar .nav-item:first-child');
                if (overviewLink) {
                    overviewLink.classList.add('active');
                }
            }
        });

        // ===== SIDEBAR SCROLL ON MOBILE =====
        // Allow horizontal scrolling on mobile sidebar
        const sidebar = document.getElementById('adminSidebar');
        if (sidebar) {
            let isDown = false;
            let startX;
            let scrollLeft;

            sidebar.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - sidebar.offsetLeft;
                scrollLeft = sidebar.scrollLeft;
            });

            sidebar.addEventListener('mouseleave', () => {
                isDown = false;
            });

            sidebar.addEventListener('mouseup', () => {
                isDown = false;
            });

            sidebar.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - sidebar.offsetLeft;
                const walk = (x - startX) * 2;
                sidebar.scrollLeft = scrollLeft - walk;
            });
        }
    </script>
</body>
</html>
